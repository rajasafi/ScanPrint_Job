services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: printdoc
      POSTGRES_USER: printdoc_app
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your environment}
    volumes:
      - printdoc-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printdoc_app -d printdoc"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://database:5432/printdoc
      DATABASE_USERNAME: printdoc_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in your environment}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in your environment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PRINTDOC_SEED_ENABLED: "true"
      UPLOAD_DIRECTORY: /var/lib/printdoc/uploads
    ports:
      - "8080:8080"
    volumes:
      - printdoc-uploads:/var/lib/printdoc/uploads
    restart: unless-stopped
volumes:
  printdoc-pgdata:
  printdoc-uploads:
