spring.application.name=printdoc-api
server.port=${SERVER_PORT:8080}
spring.profiles.default=dev
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
printdoc.jwt.secret=${JWT_SECRET:}
printdoc.jwt.ttl=PT8H
printdoc.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
printdoc.auth.bootstrap-email=${BOOTSTRAP_ADMIN_EMAIL:}
printdoc.auth.bootstrap-password=${BOOTSTRAP_ADMIN_PASSWORD:}
printdoc.auth.bootstrap-enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
printdoc.auth.registration-enabled=${ALLOW_PUBLIC_REGISTRATION:false}
printdoc.seed.enabled=${PRINTDOC_SEED_ENABLED:true}
printdoc.upload.max-file-size-mb=${MAX_FILE_SIZE_MB:20}
printdoc.storage.directory=${UPLOAD_DIRECTORY:./data/uploads}
printdoc.cleanup.interval-ms=${UPLOAD_CLEANUP_INTERVAL_MS:600000}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE_MB:20}MB
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE_MB:25}MB
printdoc.socket.enabled=${SOCKET_IO_ENABLED:false}
printdoc.socket.hostname=${SOCKET_IO_HOSTNAME:0.0.0.0}
printdoc.socket.port=${SOCKET_IO_PORT:9092}
printdoc.socket.context=${SOCKET_IO_CONTEXT:/socket.io}
printdoc.socket.allowed-origin=${SOCKET_IO_ALLOWED_ORIGIN:*}
