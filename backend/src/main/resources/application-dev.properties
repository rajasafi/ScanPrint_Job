spring.datasource.url=jdbc:h2:file:./data/printdoc;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.security.user.name=
spring.security.user.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.flyway.enabled=false
# Local development only: lets you create your own shop account from the signup screen.
printdoc.auth.registration-enabled=${ALLOW_PUBLIC_REGISTRATION:true}
logging.level.com.printdoc=INFO
logging.level.org.springframework.security=WARN
