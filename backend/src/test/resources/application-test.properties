spring.datasource.url=jdbc:h2:mem:printdoc-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.security.user.name=
spring.security.user.password=
spring.flyway.enabled=false
spring.h2.console.enabled=false
printdoc.jwt.secret=test-secret-value-with-more-than-thirty-two-characters
printdoc.seed.enabled=true
printdoc.auth.bootstrap-enabled=false
printdoc.auth.registration-enabled=true
printdoc.cleanup.interval-ms=3600000
